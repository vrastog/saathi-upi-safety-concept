<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Saathi Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap">
<style>
:root{--blue:#1a73e8;--blue-dark:#174ea6;--blue-soft:#e8f0fe;--blue-mid:#d2e3fc;--red:#ea4335;--red-dark:#c5221f;--red-soft:#fce8e6;--yellow:#fbbc04;--yellow-soft:#fef7e0;--amber:#b06000;--green:#34a853;--green-dark:#137333;--green-soft:#e6f4ea;--ink:#202124;--muted:#5f6368;--line:#dadce0;--surface:#f8f9fa;--font:"Google Sans",Roboto,"Noto Sans Devanagari",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:400 16px/1.45 var(--font)}button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--blue);font-weight:500;padding:9px 18px;min-height:44px}button:focus-visible,select:focus-visible{outline:3px solid #8ab4f8;outline-offset:2px}button:disabled{opacity:.55;cursor:not-allowed}
.notice{background:var(--ink);color:#fff;padding:8px 16px;text-align:center;font-size:13px}.site{max-width:1120px;margin:auto;padding:18px 16px 4px}.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.site h1{font-size:26px;font-weight:400;margin:0}.site p{margin:4px 0 0;color:var(--muted)}.gpay{display:inline-flex;align-items:center;gap:4px;font-weight:500;color:var(--muted)}nav.top{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}nav.top button{color:var(--muted)}nav.top button[aria-selected=true]{background:var(--blue-soft);color:var(--blue-dark);border-color:var(--blue-mid)}main{max-width:1120px;margin:auto;padding:14px 16px 28px}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}label{font-size:13px;color:var(--muted);display:grid;gap:3px}select{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;min-height:44px;max-width:100%}.demo-layout{display:grid;grid-template-columns:280px auto;gap:26px;align-items:start;justify-content:center}.guide{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;position:sticky;top:10px}.guide h2{font-size:18px;font-weight:500;margin:0 0 3px}.guide>p{font-size:14px;color:var(--muted);margin:0 0 12px}.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:3px}.steps li{display:grid;grid-template-columns:26px 1fr;gap:9px;padding:7px;border-radius:12px;font-size:13.5px;color:var(--muted)}.steps b{font-weight:500;display:block;color:inherit}.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:12px}.steps .now{background:var(--blue-soft);color:var(--blue-dark)}.steps .now .n{background:var(--blue);border-color:var(--blue);color:#fff}.steps .past .n{background:var(--green-soft);border-color:var(--green-soft);color:var(--green-dark)}
.stage{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}.phonewrap h2{font-size:14px;margin:0 0 8px;text-align:center;color:var(--muted);font-weight:500}.phone{position:relative;width:346px;max-width:calc(100vw - 32px);height:736px;background:#fff;border-radius:48px;border:10px solid #111317;box-shadow:0 0 0 2px #5f6368,0 18px 36px rgba(60,64,67,.26);overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 25px 0;font-size:14px;font-weight:500;position:relative;z-index:3}.island{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:92px;height:26px;border-radius:20px;background:#111317}.sig{display:flex;gap:4px;align-items:center}.screen{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 14px;display:flex;flex-direction:column;gap:13px;position:relative;scrollbar-width:none}.home-top{display:flex;align-items:center;gap:9px}.searchbar{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#f1f3f4;border-radius:999px;padding:10px 13px;color:var(--muted);font-size:14px}.wordmark{display:flex;align-items:center;gap:3px;font-size:18px;font-weight:500;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 3px}.tile{border:0;background:none;padding:0;min-height:0;display:grid;justify-items:center;gap:4px;color:var(--ink);font-size:11.5px;font-weight:400;line-height:1.2;text-align:center}.tile i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff}.tile:nth-child(4n+2) i{background:var(--blue-dark)}
.saathi-card{width:100%;text-align:left;border:1px solid var(--blue-mid);background:var(--blue-soft);border-radius:18px;padding:11px 12px;display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:400}.saathi-card.alert{background:var(--yellow-soft);border-color:#fde293}.saathi-card b{font-weight:500}.saathi-card small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}.badge{font-size:10px;font-weight:700;background:var(--blue);color:#fff;border-radius:6px;padding:2px 5px;margin-left:5px}.shieldico{width:38px;height:38px;flex:none;border-radius:12px;background:#fff;color:var(--blue);display:grid;place-items:center}.chev{margin-left:auto;color:var(--muted)}
.label{font-size:17px;font-weight:500;margin:0 0 -4px}.people{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.person{border:0;background:none;padding:2px;min-height:0;color:var(--ink);font-size:12px;font-weight:400;display:grid;justify-items:center;gap:4px;min-width:0}.person span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person span.hint{max-width:none;overflow:visible}.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:500;flex:none}.listrow{display:flex;align-items:center;gap:11px;font-size:14px;padding:9px 0;border-bottom:1px solid #f1f3f4;color:var(--ink)}
.scanbar{flex:none;padding:7px 16px 4px;display:flex;justify-content:center;background:#fff;box-shadow:0 -1px 3px rgba(60,64,67,.12)}.scanbar button{background:var(--blue);color:#fff;border-color:var(--blue);min-height:42px;display:inline-flex;gap:7px;align-items:center}.homebar{flex:none;height:16px;display:grid;place-items:center;background:inherit}.homebar::after{content:"";width:116px;height:4px;border-radius:4px;background:#202124}.appback{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:500}.iconbtn{width:44px;height:44px;padding:0;border:0;background:none;color:var(--ink);display:grid;place-items:center;margin-left:-11px}.amount{font-size:40px;font-weight:500;line-height:1.1}.center{text-align:center;justify-items:center;align-items:center}.muted{color:var(--muted);font-size:14px}.small{font-size:13px}.row{display:flex;align-items:center;gap:10px}.primary{background:var(--blue);color:#fff;border-color:var(--blue);width:100%;min-height:48px}.secondary{width:100%;min-height:46px}.actions{margin-top:auto;display:grid;gap:8px;padding-top:4px}.box{background:var(--blue-soft);border-radius:16px;padding:12px 14px;font-size:14.5px}.box.warn{background:var(--yellow-soft);border:1px solid #fde293}.hi{font-size:16px;font-weight:500;line-height:1.5}.pill{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;justify-self:start;background:var(--blue-soft);color:var(--blue-dark);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:500}.pill.warn{background:#feefc3;color:var(--amber)}.pausehead{margin:-8px -16px 0;padding:12px 16px;background:linear-gradient(180deg,var(--yellow-soft),#fff);display:grid;gap:7px}.pausehead h3{font-size:23px;line-height:1.25;margin:0;font-weight:500}.bigicon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green-dark);margin:18px auto 4px}.bigicon.blue{background:var(--blue-mid);color:var(--blue)}.title{font-size:24px;font-weight:400;margin:0;line-height:1.2}
.lock{flex:1;min-height:0;margin-top:-44px;padding:62px 15px 10px;background:linear-gradient(165deg,#174ea6,#1a73e8 58%,#8ab4f8);color:#fff;display:flex;flex-direction:column;gap:10px}.clock{text-align:center;font-size:56px;font-weight:400;line-height:1}.date{text-align:center;font-size:14px;margin-bottom:8px}.notif{background:rgba(255,255,255,.97);color:var(--ink);border-radius:22px;padding:14px;display:grid;gap:8px;box-shadow:0 10px 24px rgba(23,78,166,.35)}.notif .amount{font-size:30px}.callscreen{flex:1;min-height:0;margin-top:-44px;padding:84px 18px 12px;background:linear-gradient(180deg,#202124,#3c4043);color:#fff;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}.callscreen .actions{width:100%}.callscreen .primary{background:#fff;color:var(--blue-dark);border-color:#fff}.callscreen .secondary{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}.phone[data-mode=lock],.phone[data-mode=lock] .homebar{background:#8ab4f8}.phone[data-mode=call],.phone[data-mode=call] .homebar{background:#3c4043}.phone[data-mode=lock] .status,.phone[data-mode=call] .status{color:#fff}.phone[data-mode=lock] .homebar::after,.phone[data-mode=call] .homebar::after{background:#fff}.hot{position:relative;z-index:2;animation:pulse 1.6s infinite}.hint{position:absolute;z-index:6;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:500;white-space:nowrap;pointer-events:none}.hint::after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--ink)}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,115,232,.55)}70%{box-shadow:0 0 0 10px rgba(26,115,232,0)}100%{box-shadow:0 0 0 0 rgba(26,115,232,0)}}@media (prefers-reduced-motion:reduce){.hot{animation:none;box-shadow:0 0 0 3px rgba(26,115,232,.6)}}
.toast{position:absolute;z-index:9;left:14px;right:14px;bottom:76px;background:#323232;color:#fff;border-radius:10px;padding:10px 13px;font-size:13px}.why{max-width:716px;margin:18px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:14px}.gallery{display:flex;gap:24px;overflow-x:auto;padding:6px 6px 22px}.gallery .phone{flex:0 0 300px;height:640px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:right;font-weight:400}th{font-weight:500}th:first-child,td:first-child{text-align:left}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:8px 0 22px}.callout{background:var(--yellow-soft);border-radius:12px;padding:12px 14px;margin-bottom:18px}h2.section{font-size:19px;font-weight:500;margin:18px 0 4px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}@media (max-width:1040px){.demo-layout{grid-template-columns:minmax(0,1fr)}.guide{position:static;max-width:716px;width:100%;margin:auto}.steps{display:none}}
</style>
</head>
<body>
<div class="notice">Saathi is a student product concept for Google Pay, not affiliated with Google. Simulated demo, no real payments.</div>
<div class="site">
<div class="brandrow"><span class="gpay" id="brand"></span><h1>+ Saathi concept</h1></div>
<p>See how a family safety check could live inside the Google Pay experience.</p>
<nav class="top" role="tablist"><button role="tab" data-tab="demo" aria-selected="true">Try the experience</button><button role="tab" data-tab="screens" aria-selected="false">Setup and privacy</button><button role="tab" data-tab="eval" aria-selected="false">Model evaluation</button></nav>
</div>
<main>
<section id="demo">
<div class="sr" id="live" aria-live="polite"></div>
<div class="demo-layout">
<aside class="guide" id="guide"></aside>
<div><div class="stage"><div class="phonewrap"><h2>Senior's Google Pay</h2><div class="phone" id="senior"></div></div><div class="phonewrap"><h2>Trusted contact's phone</h2><div class="phone" id="contact"></div></div></div></div>
</div>
<div class="why" id="why"></div>
</section>
<section id="screens" hidden><div class="gallery" id="gallery"></div></section>
<section id="eval" hidden></section>
</main>
<script src="score.js"></script><script src="app.js"></script>
</body>
</html>
